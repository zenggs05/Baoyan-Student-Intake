name = "baoyan-site"
main = "src/worker/index.js"
compatibility_date = "2026-11-01"

# Served only on the custom domain (workers.dev is unreliable from mainland China).
workers_dev = false
preview_urls = false
routes = [
  { pattern = "feiniaofly.cn", custom_domain = true },
  { pattern = "www.feiniaofly.cn", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
# The Worker runs first for /api/* AND for HTML pages, so it can add security headers
# (X-Frame-Options / Referrer-Policy / nosniff). Bundled JS/CSS/data files skip the Worker
# and are served directly as static assets (no Worker invocation, no cost).
run_worker_first = [
  "/*",
  "!/*.js",
  "!/*.css",
  "!/*.json",
  "!/*.png",
  "!/*.jpg",
  "!/*.svg",
  "!/*.ico",
  "!/*.webp",
  "!/*.woff2",
  "!/*.txt",
  "!/data/*",
]

[[kv_namespaces]]
binding = "KV"
id = "9f8b8bcfa74a4646b10cec22c372b0f1"  # baoyan-site-kv (production)

# Brute-force protection for /api/redeem, /api/login (10/min/IP) and /api/admin/login (5/min/IP).
# Skipped automatically if the binding is unavailable.
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
