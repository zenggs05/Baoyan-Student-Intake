<!doctype html>
<!--
  GitHub Pages 旧地址跳转页（zenggs05.github.io/Baoyan-Student-Intake/）。
  网站已迁移到 https://feiniaofly.cn/ 。本页把学员在旧地址保存在本机的草稿
  （localStorage，键 baoyan-student-intake:v1）编码进 URL 的 # 片段带到新站；
  # 片段不会发送给任何服务器，新站读取后会立即从地址栏清除。
  注意：本文件只用于 GitHub Pages，与 Cloudflare 上的网站（src/ → dist/）无关。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>网站已迁移 · 保研全程陪跑</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#172946;
      font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;line-height:1.7}
    .card{max-width:460px;margin:24px;padding:28px 26px;background:#fff;border:1px solid #e4e9f1;border-radius:16px;
      box-shadow:0 6px 24px rgba(23,41,70,.06)}
    h1{font-size:20px;margin:0 0 8px} p{margin:8px 0;color:#465972;font-size:15px}
    a.btn,button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;margin:12px 8px 0 0;
      border-radius:10px;border:1px solid #172946;background:#172946;color:#fff;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
    button.secondary{background:#fff;color:#172946;border-color:#d9e1ec}
    .muted{color:#718097;font-size:13px}
  </style>
</head>
<body>
  <main class="card">
    <h1>网站已迁移到新地址</h1>
    <p id="msg">学员信息采集已搬到 <strong>feiniaofly.cn</strong>，正在为你跳转……</p>
    <div id="actions"><a class="btn" id="go" href="https://feiniaofly.cn/intake/">前往新网站</a></div>
    <p class="muted">公众号：飞鸟想要飞</p>
  </main>
  <script>
    (function () {
      var TARGET = 'https://feiniaofly.cn/intake/';
      var KEY = 'baoyan-student-intake:v1';
      var LIMIT = 1500000; // 超过约 1.5MB 的草稿不放进网址，改为让学员手动导出
      var raw = null;
      try { raw = window.localStorage && localStorage.getItem(KEY); } catch (e) { raw = null; }
      if (!raw) { location.replace(TARGET); return; }
      try {
        var bytes = new TextEncoder().encode(raw);
        if (bytes.length <= LIMIT) {
          var bin = '';
          for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
          var enc = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
          document.getElementById('msg').textContent = '检测到你在这里保存过草稿，正在把它一起带到新网站……';
          location.replace(TARGET + '#transfer=' + enc);
          return;
        }
      } catch (e) { /* fall through to manual export */ }
      // 草稿太大或编码失败：让学员先下载备份，再到新网站「导入 JSON 恢复」
      document.getElementById('msg').textContent = '检测到你在这里保存过一份较大的草稿。请先下载备份文件，再到新网站点「导入 JSON 恢复」。';
      var btn = document.createElement('button');
      btn.className = 'secondary';
      btn.textContent = '下载我的草稿备份';
      btn.onclick = function () {
        var url = URL.createObjectURL(new Blob([raw], { type: 'application/json' }));
        var a = document.createElement('a'); a.href = url; a.download = '保研基本信息表_草稿备份.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      };
      document.getElementById('actions').appendChild(btn);
    })();
  </script>
</body>
</html>
